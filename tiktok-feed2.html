<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>動画フィード</title>
<style>
/* ── リセット ── */
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;font-family:'Helvetica Neue','Hiragino Sans',sans-serif;overflow:hidden;height:100svh;user-select:none;-webkit-user-select:none;}

/* ── メイン ── */
#app{position:relative;width:100vw;height:100svh;overflow:hidden;}
#feed-wrap{position:relative;width:100%;height:100%;}

/* ── スライド（3枚固定） ── */
.v-slide{position:absolute;inset:0;background:#000;overflow:hidden;visibility:hidden;}
.v-slide video{width:100%;height:100%;object-fit:cover;display:block;}

/* ── 動画タイトルオーバーレイ ── */
.v-info{position:absolute;bottom:100px;left:20px;right:80px;z-index:5;pointer-events:none;}
.v-num{color:rgba(255,255,255,.4);font-size:11px;font-weight:600;letter-spacing:.06em;margin-bottom:3px;}
.v-name{color:#fff;font-size:15px;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.9);line-height:1.4;word-break:break-all;}

/* ── 最初のタップ待ち ── */
.tap-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:8;background:rgba(0,0,0,.5);}
.tap-circle{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:28px;padding-left:5px;}
.tap-label{color:rgba(255,255,255,.85);font-size:14px;font-weight:600;}

/* ── 黒画面 ── */
.black-ov{position:absolute;inset:0;background:#000;z-index:10;display:none;}

/* ── 一時停止フラッシュ ── */
.pause-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;pointer-events:none;font-size:64px;animation:pf .65s ease-out forwards;}
@keyframes pf{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}

/* ── ローディング画面 ── */
#loading{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.l-icon{font-size:48px;}
.l-text{color:rgba(255,255,255,.65);font-size:14px;}
.l-bar-bg{width:180px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
.l-bar{height:100%;background:#fff;border-radius:2px;width:0;transition:width .25s;}

/* ── 空状態 ── */
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.5);}
.e-icon{font-size:52px;}
.e-msg{font-size:14px;text-align:center;line-height:1.7;padding:0 32px;}
.e-sub{font-size:11px;color:rgba(255,255,255,.28);text-align:center;}

/* ── DEVボタン ── */
#dev-btn{
  position:fixed;top:20px;right:16px;z-index:9999;
  background:rgba(20,20,20,.92);border:1px solid rgba(255,255,255,.25);
  color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;
  padding:9px 18px;border-radius:22px;cursor:pointer;
  box-shadow:0 2px 16px rgba(0,0,0,.6);
  -webkit-tap-highlight-color:transparent;
}

/* ── DEVパネル ── */
#dev-panel{
  position:fixed;top:0;right:0;
  width:min(320px,100vw);height:100svh;
  background:#0d0d13;border-left:1px solid rgba(255,255,255,.07);
  z-index:500;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
#dev-panel.open{transform:translateX(0);}

.p-head{display:flex;align-items:center;gap:10px;padding:52px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.p-badge{background:#e63946;color:#fff;font-size:9px;font-weight:800;letter-spacing:.12em;padding:3px 7px;border-radius:4px;}
.p-title{color:#fff;font-size:14px;font-weight:600;flex:1;}
.p-close{background:none;border:none;color:rgba(255,255,255,.4);font-size:22px;cursor:pointer;padding:2px 6px;line-height:1;-webkit-tap-highlight-color:transparent;}

/* タブ */
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;}
.tbtn{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.38);font-size:11px;font-weight:600;padding:11px 2px;cursor:pointer;transition:color .18s,border-color .18s;-webkit-tap-highlight-color:transparent;}
.tbtn.on{color:#fff;border-bottom-color:#fff;}
.tcon{display:none;flex:1;overflow-y:auto;padding:16px;}
.tcon.on{display:block;}

/* セクションラベル */
.slabel{color:rgba(255,255,255,.38);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;}
.cbadge{background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-size:10px;padding:1px 7px;border-radius:10px;margin-left:5px;}
.dempty{color:rgba(255,255,255,.22);font-size:12px;text-align:center;padding:24px 0;}

/* ストレージ */
.st-bar-bg{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-bottom:6px;}
.st-bar{height:100%;background:#4ade80;border-radius:2px;transition:width .4s;}
.st-text{color:rgba(255,255,255,.3);font-size:10px;margin-bottom:16px;}

/* ドロップゾーン */
.dz{border:2px dashed rgba(255,255,255,.13);border-radius:10px;background:rgba(255,255,255,.02);padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px;-webkit-tap-highlight-color:transparent;}
.dz:active{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);}
.dz-icon{font-size:28px;}.dz-text{color:rgba(255,255,255,.6);font-size:12px;font-weight:500;text-align:center;line-height:1.5;}.dz-sub{color:rgba(255,255,255,.25);font-size:10px;}

/* キュー */
#queue-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.q-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px;}
.q-thumb{width:60px;height:42px;object-fit:cover;border-radius:5px;flex-shrink:0;background:#1a1a1a;}
.q-inp{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:7px 8px;color:#fff;font-size:11px;outline:none;min-width:0;}
.q-inp:focus{border-color:rgba(255,255,255,.28);}
.q-del{background:none;border:none;color:rgba(255,255,255,.3);font-size:18px;cursor:pointer;flex-shrink:0;padding:4px;-webkit-tap-highlight-color:transparent;}

/* 追加ボタン */
.add-btn{width:100%;padding:12px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,color .2s;margin-bottom:16px;-webkit-tap-highlight-color:transparent;background:rgba(255,255,255,.07);color:rgba(255,255,255,.32);}
.add-btn.ready{background:#fff;color:#000;}
.add-btn.done{background:#4ade80;color:#000;}
.add-btn:disabled{opacity:.6;}

/* 動画リスト */
.vli{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px;margin-bottom:6px;}
.vli-th{width:46px;height:32px;object-fit:cover;border-radius:5px;flex-shrink:0;background:#1a1a1a;}
.vli-info{flex:1;min-width:0;}
.vli-name{color:#ccc;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vli-sz{color:rgba(255,255,255,.26);font-size:10px;margin-top:2px;}
.vli-act{display:flex;gap:3px;flex-shrink:0;}
.abtn{background:rgba(255,255,255,.06);border:none;color:rgba(255,255,255,.4);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:11px;-webkit-tap-highlight-color:transparent;}
.abtn:active:not(:disabled){background:rgba(255,255,255,.18);}
.abtn:disabled{opacity:.18;cursor:default;}
.dbtn{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.28);color:#e63946;font-size:10px;padding:4px 8px;border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.dbtn:active{background:rgba(230,57,70,.25);}

/* ログ */
.log-tbl{display:flex;flex-direction:column;gap:4px;}
.log-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:8px 10px;border-radius:6px;background:rgba(255,255,255,.04);color:#bbb;}
.log-head{background:rgba(255,255,255,.08);color:rgba(255,255,255,.45);font-weight:700;font-size:10px;}
.log-sum{margin-top:14px;border-top:1px solid rgba(255,255,255,.07);padding-top:14px;display:flex;flex-direction:column;gap:6px;}
.log-sum-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#fff;}

/* 設定 */
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.tgl-info .tlabel{color:#ddd;font-size:13px;font-weight:600;}
.tgl-info .tsub{color:rgba(255,255,255,.32);font-size:11px;margin-top:3px;line-height:1.4;}
.tgl{width:48px;height:28px;border-radius:14px;border:none;cursor:pointer;position:relative;flex-shrink:0;background:rgba(255,255,255,.13);transition:background .25s;-webkit-tap-highlight-color:transparent;}
.tgl.on{background:#4ade80;}
.tgl-k{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.tgl.on .tgl-k{left:23px;}
.guide{margin-top:20px;}
.guide-title{color:rgba(255,255,255,.38);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;}
.guide-list{display:flex;flex-direction:column;gap:8px;color:rgba(255,255,255,.38);font-size:12px;line-height:1.6;}
.clr-btn{width:100%;margin-top:24px;padding:11px;border-radius:8px;border:1px solid rgba(230,57,70,.28);background:rgba(230,57,70,.07);color:#e63946;font-size:12px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.clr-btn:active{background:rgba(230,57,70,.2);}
</style>
</head>
<body>

<div id="loading">
  <div class="l-icon">🎬</div>
  <div class="l-text">読み込み中...</div>
  <div class="l-bar-bg"><div class="l-bar" id="l-bar"></div></div>
</div>

<div id="app">
  <div id="empty">
    <div class="e-icon">🎬</div>
    <div class="e-msg">右上のDEVボタンから<br>動画を追加してください</div>
    <div class="e-sub">追加した動画はこのiPhoneに保存されます</div>
  </div>
  <div id="feed-wrap"></div>
  <button id="dev-btn">DEV</button>
</div>

<div id="dev-panel">
  <div class="p-head">
    <span class="p-badge">DEV</span>
    <span class="p-title">開発者設定</span>
    <button class="p-close" id="p-close">✕</button>
  </div>
  <div class="tabs">
    <button class="tbtn on" data-tab="videos">📋 動画管理</button>
    <button class="tbtn" data-tab="watch">⏱ 視聴ログ</button>
    <button class="tbtn" data-tab="settings">⚙️ 設定</button>
  </div>

  <!-- 動画管理 -->
  <div class="tcon on" id="tab-videos">
    <div class="slabel">動画を追加（複数可）</div>
    <div class="dz" id="dz">
      <div class="dz-icon">🎬</div>
      <div class="dz-text">タップして動画を選択</div>
      <div class="dz-sub">MP4 / MOV / WebM・複数選択OK</div>
    </div>
    <div id="queue-list"></div>
    <button class="add-btn" id="add-btn">＋ 動画を選択</button>
    <div class="slabel">登録済み動画 <span class="cbadge" id="vcnt">0</span></div>
    <div class="st-bar-bg"><div class="st-bar" id="st-bar"></div></div>
    <div class="st-text" id="st-text">ストレージ: 計算中...</div>
    <div id="vlist"></div>
  </div>

  <!-- 視聴ログ -->
  <div class="tcon" id="tab-watch">
    <div class="slabel" style="margin-bottom:12px">視聴時間ログ</div>
    <div id="watch-log-el"></div>
  </div>

  <!-- 設定 -->
  <div class="tcon" id="tab-settings">
    <div class="slabel" style="margin-bottom:4px">再生設定</div>
    <div class="tgl-row">
      <div class="tgl-info">
        <div class="tlabel">遷移時 黒画面（最低1秒）</div>
        <div class="tsub">動画切り替え時に黒画面を挿入する<br>スキップ不可</div>
      </div>
      <button class="tgl" id="black-tgl"><span class="tgl-k"></span></button>
    </div>
    <div class="guide">
      <div class="guide-title">操作ガイド</div>
      <div class="guide-list">
        <div>📱 上スワイプ → 次の動画</div>
        <div>📱 下スワイプ → 前の動画</div>
        <div>👆 画面タップ → 一時停止 / 再生</div>
        <div>🔊 音声は最初のタップから再生</div>
      </div>
    </div>
    <button class="clr-btn" id="clr-btn">⚠️ 保存データをすべて削除</button>
  </div>
</div>

<input type="file" id="file-input" accept="video/*" multiple style="display:none">

<script>
// ══════════════════════════════════════════════════════
// IndexedDB
// ══════════════════════════════════════════════════════
const IDB = (() => {
  const NAME = 'vfeed', VER = 1, ST = 'videos';
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open(NAME, VER);
    r.onupgradeneeded = e => {
      if (!e.target.result.objectStoreNames.contains(ST))
        e.target.result.createObjectStore(ST, { keyPath: 'id' });
    };
    r.onsuccess = e => { db = e.target.result; res(); };
    r.onerror   = e => rej(e.target.error);
  });
  const tx   = (mode) => db.transaction(ST, mode).objectStore(ST);
  const wrap = (req) => new Promise((res, rej) => { req.onsuccess = e => res(e.target.result); req.onerror = e => rej(e.target.error); });
  return {
    open,
    getAll:   ()  => wrap(tx('readonly').getAll()),
    put:      (r) => wrap(tx('readwrite').put(r)),
    delete:   (id)=> wrap(tx('readwrite').delete(id)),
    get:      (id)=> wrap(tx('readonly').get(id)),
    clear:    ()  => wrap(tx('readwrite').clear()),
  };
})();

// ══════════════════════════════════════════════════════
// 状態
// ══════════════════════════════════════════════════════
let videos        = [];   // {id,title,src(objectURL),order,size}
let queue         = [];   // {qid,title,src,blob,size}
let cur           = 0;
let useBlack      = false;
let started       = false; // 最初のタップ済み
let locked        = false; // 黒画面中=true（スワイプ・タップ禁止）
let transLock     = false; // 遷移アニメーション中
let watchLog      = [];   // {id,title,ms}
let wStart        = null;
let wId           = null;
let uidGen        = Date.now();

const SLOTS = ['prev','cur','next'];
const S     = {};   // スライドオブジェクト

const fmtT = ms => {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return `${h}:${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
};
const fmtB = b => b>1e9?(b/1e9).toFixed(1)+'GB':b>1e6?(b/1e6).toFixed(1)+'MB':(b/1e3|0)+'KB';

// ══════════════════════════════════════════════════════
// DOM参照
// ══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const appEl    = $('app');
const feedWrap = $('feed-wrap');
const emptyEl  = $('empty');
const devBtn   = $('dev-btn');
const devPanel = $('dev-panel');
const fileInp  = $('file-input');
const queueEl  = $('queue-list');
const addBtn   = $('add-btn');
const vlistEl  = $('vlist');
const vcntEl   = $('vcnt');
const wlogEl   = $('watch-log-el');
const blackTgl = $('black-tgl');
const stBar    = $('st-bar');
const stText   = $('st-text');
const lBar     = $('l-bar');
const loadEl   = $('loading');

// ══════════════════════════════════════════════════════
// 3スライド生成（起動時1回のみ）
// ══════════════════════════════════════════════════════
SLOTS.forEach(slot => {
  const el     = document.createElement('div');
  el.className = 'v-slide';

  const vid = document.createElement('video');
  vid.loop  = true; vid.muted = false;
  vid.setAttribute('playsinline','');
  vid.setAttribute('webkit-playsinline','');
  el.appendChild(vid);

  const blk = document.createElement('div');
  blk.className = 'black-ov';
  el.appendChild(blk);

  const tapOv = document.createElement('div');
  tapOv.className = 'tap-ov';
  tapOv.innerHTML = '<div class="tap-circle">▶</div><div class="tap-label">タップして再生</div>';
  tapOv.style.display = 'none';
  el.appendChild(tapOv);

  const info = document.createElement('div');
  info.className = 'v-info';
  el.appendChild(info);

  el.addEventListener('click', onTap);
  feedWrap.appendChild(el);
  S[slot] = { el, vid, blk, tapOv, info };
});

// ══════════════════════════════════════════════════════
// フィード描画
// ══════════════════════════════════════════════════════
function showEmpty(yes) {
  emptyEl.style.display = yes ? 'flex' : 'none';
  SLOTS.forEach(s => { S[s].el.style.visibility = yes ? 'hidden' : 'visible'; });
}

function posY(off) { return `translateY(${off * 100}vh)`; }

function assignSlot(slot, idx) {
  const s = S[slot];
  if (idx < 0 || idx >= videos.length) {
    // 範囲外：src解放・非表示
    if (s.vid.dataset.id) {
      s.vid.pause();
      s.vid.removeAttribute('src');
      s.vid.load();
      s.vid.dataset.id = '';
    }
    s.el.style.visibility = 'hidden';
    return;
  }
  const v = videos[idx];
  s.el.style.visibility = 'visible';
  s.el.style.transition = 'none';
  s.el.style.transform  = posY(idx - cur);
  // srcが変わった時だけ再セット
  if (s.vid.dataset.id !== String(v.id)) {
    s.vid.pause();
    s.vid.src       = v.src;
    s.vid.dataset.id = String(v.id);
    s.vid.load();
  }
  s.info.innerHTML = `<div class="v-num">${idx+1} / ${videos.length}</div><div class="v-name">${v.title}</div>`;
  s.blk.style.display    = 'none';
  s.tapOv.style.display  = (slot === 'cur' && !started) ? 'flex' : 'none';
  if (slot !== 'cur') s.vid.pause();
}

function refreshSlides() {
  if (!videos.length) { showEmpty(true); return; }
  showEmpty(false);
  assignSlot('prev', cur - 1);
  assignSlot('cur',  cur);
  assignSlot('next', cur + 1);
}

// ══════════════════════════════════════════════════════
// 再生制御
// ══════════════════════════════════════════════════════
function doPlay(vid) { const p = vid.play(); if(p) p.catch(()=>{}); }

function startCurrent() {
  const { vid, blk } = S['cur'];
  saveWatch();

  if (useBlack) {
    locked = true;
    blk.style.display = 'block';
    vid.pause();
    vid.currentTime = 0;

    // 「1秒経過」と「再生可能になった」の両方を待ってから進む
    const wait1sec   = new Promise(res => setTimeout(res, 1000));
    const waitReady  = new Promise(res => {
      if (vid.readyState >= 3) { res(); return; }
      vid.addEventListener('canplay', res, { once: true });
    });

    Promise.all([wait1sec, waitReady]).then(() => {
      blk.style.display = 'none';
      locked = false;
      doPlay(vid);
      beginWatch();
    });
  } else {
    vid.currentTime = 0;
    doPlay(vid);
    beginWatch();
  }
}

function beginWatch() {
  wStart = Date.now();
  wId    = videos[cur]?.id ?? null;
}

function saveWatch() {
  if (wStart !== null && wId !== null) {
    const ms = Date.now() - wStart;
    if (ms > 300) {
      const v = videos.find(v => v.id === wId);
      watchLog.push({ id: wId, title: v?.title ?? `#${wId}`, ms });
    }
  }
  wStart = null; wId = null;
}

// ══════════════════════════════════════════════════════
// タップ処理
// ══════════════════════════════════════════════════════
function onTap() {
  if (devPanel.classList.contains('open')) return;
  if (locked) return; // 黒画面中は無視

  if (!started) {
    started = true;
    S['cur'].tapOv.style.display = 'none';
    startCurrent();
    return;
  }
  const vid = S['cur'].vid;
  if (vid.paused) {
    doPlay(vid); beginWatch();
  } else {
    vid.pause(); saveWatch();
    const f = document.createElement('div');
    f.className = 'pause-flash'; f.textContent = '⏸';
    S['cur'].el.appendChild(f);
    setTimeout(() => f.remove(), 700);
  }
}

// ══════════════════════════════════════════════════════
// ナビゲーション
// ══════════════════════════════════════════════════════
function goTo(next) {
  if (locked || transLock) return;
  if (next < 0 || next >= videos.length) return;
  transLock = true;

  saveWatch();
  S['cur'].vid.pause();
  cur = next;

  assignSlot('prev', cur - 1);
  assignSlot('cur',  cur);
  assignSlot('next', cur + 1);

  if (started) startCurrent();
  setTimeout(() => { transLock = false; }, 350);
}

// ══════════════════════════════════════════════════════
// スワイプ
// ══════════════════════════════════════════════════════
let ty0 = null, tx0 = null;
appEl.addEventListener('touchstart', e => {
  ty0 = e.touches[0].clientY;
  tx0 = e.touches[0].clientX;
}, { passive: true });

appEl.addEventListener('touchend', e => {
  if (ty0 === null || locked) { ty0 = tx0 = null; return; }
  const dy = ty0 - e.changedTouches[0].clientY;
  const dx = tx0 - e.changedTouches[0].clientX;
  if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 44)
    dy > 0 ? goTo(cur + 1) : goTo(cur - 1);
  ty0 = tx0 = null;
}, { passive: true });

// ══════════════════════════════════════════════════════
// DEVパネル開閉
// ══════════════════════════════════════════════════════
devBtn.addEventListener('click', () => devPanel.classList.add('open'));
$('p-close').addEventListener('click', () => devPanel.classList.remove('open'));

// タブ切り替え
document.querySelectorAll('.tbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.tcon').forEach(c => c.classList.remove('on'));
    btn.classList.add('on');
    $('tab-' + btn.dataset.tab).classList.add('on');
    if (btn.dataset.tab === 'watch') renderWatchLog();
  });
});

// 黒画面トグル
blackTgl.addEventListener('click', () => {
  useBlack = !useBlack;
  blackTgl.classList.toggle('on', useBlack);
});

// 全削除
$('clr-btn').addEventListener('click', async () => {
  if (!confirm('保存されているすべての動画を削除しますか？\nこの操作は元に戻せません。')) return;
  videos.forEach(v => URL.revokeObjectURL(v.src));
  videos = []; cur = 0; started = false; locked = false;
  SLOTS.forEach(s => { S[s].vid.dataset.id = ''; });
  await IDB.clear();
  refreshSlides(); renderVList(); updateStorage();
});

// ══════════════════════════════════════════════════════
// ファイル選択・キュー
// ══════════════════════════════════════════════════════
$('dz').addEventListener('click', () => fileInp.click());
fileInp.addEventListener('change', e => {
  addToQueue([...e.target.files]);
  fileInp.value = '';
});

function addToQueue(files) {
  files.filter(f => f.type.startsWith('video/')).forEach(f => {
    queue.push({ qid: uidGen++, title: f.name.replace(/\.[^.]+$/, ''), src: URL.createObjectURL(f), blob: f, size: f.size });
  });
  renderQueue();
}

function renderQueue() {
  queueEl.innerHTML = '';
  queue.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'q-row';

    const th = document.createElement('video');
    th.className = 'q-thumb'; th.src = item.src; th.muted = true;
    th.setAttribute('playsinline','');
    row.appendChild(th);

    const inp = document.createElement('input');
    inp.className = 'q-inp'; inp.value = item.title;
    inp.addEventListener('input', () => { queue[i].title = inp.value; });
    row.appendChild(inp);

    const del = document.createElement('button');
    del.className = 'q-del'; del.textContent = '✕';
    del.addEventListener('click', () => { URL.revokeObjectURL(item.src); queue.splice(i, 1); renderQueue(); });
    row.appendChild(del);

    queueEl.appendChild(row);
  });

  addBtn.textContent = queue.length ? `フィードに追加（${queue.length}本）` : '＋ 動画を選択';
  addBtn.className   = 'add-btn' + (queue.length ? ' ready' : '');
}

addBtn.addEventListener('click', async () => {
  if (!queue.length) { fileInp.click(); return; }
  addBtn.disabled = true;
  addBtn.textContent = '保存中...';
  addBtn.className = 'add-btn';

  for (const item of queue) {
    const id = uidGen++;
    await IDB.put({ id, title: item.title, order: videos.length, size: item.size, blob: item.blob });
    videos.push({ id, title: item.title, src: URL.createObjectURL(item.blob), order: videos.length, size: item.size });
    URL.revokeObjectURL(item.src);
  }
  queue = [];
  addBtn.disabled = false;
  addBtn.textContent = '✓ 追加しました！';
  addBtn.className = 'add-btn done';
  setTimeout(() => { addBtn.textContent = '＋ 動画を選択'; addBtn.className = 'add-btn'; }, 2000);
  renderQueue();
  refreshSlides();
  renderVList();
  updateStorage();
});

// ══════════════════════════════════════════════════════
// 動画リスト
// ══════════════════════════════════════════════════════
function renderVList() {
  vcntEl.textContent = videos.length;
  vlistEl.innerHTML  = '';
  videos.forEach((v, i) => {
    const row = document.createElement('div'); row.className = 'vli';

    const th = document.createElement('video');
    th.className = 'vli-th'; th.src = v.src; th.muted = true;
    th.setAttribute('playsinline','');
    row.appendChild(th);

    const info = document.createElement('div'); info.className = 'vli-info';
    info.innerHTML = `<div class="vli-name">${v.title}</div><div class="vli-sz">${fmtB(v.size||0)}</div>`;
    row.appendChild(info);

    const act = document.createElement('div'); act.className = 'vli-act';

    const up = document.createElement('button'); up.className='abtn'; up.textContent='▲'; up.disabled=i===0;
    up.addEventListener('click', () => moveV(i, i-1));
    const dn = document.createElement('button'); dn.className='abtn'; dn.textContent='▼'; dn.disabled=i===videos.length-1;
    dn.addEventListener('click', () => moveV(i, i+1));
    const dl = document.createElement('button'); dl.className='dbtn'; dl.textContent='削除';
    dl.addEventListener('click', () => delV(v.id));
    act.append(up, dn, dl);
    row.appendChild(act);
    vlistEl.appendChild(row);
  });
}

async function moveV(from, to) {
  if (to < 0 || to >= videos.length) return;
  [videos[from], videos[to]] = [videos[to], videos[from]];
  for (let i = 0; i < videos.length; i++) {
    videos[i].order = i;
    const rec = await IDB.get(videos[i].id);
    if (rec) { rec.order = i; await IDB.put(rec); }
  }
  if (cur === from) cur = to;
  else if (cur === to) cur = from;
  SLOTS.forEach(s => { S[s].vid.dataset.id = ''; });
  refreshSlides(); renderVList();
}

async function delV(id) {
  const idx = videos.findIndex(v => v.id === id);
  if (idx === -1) return;
  URL.revokeObjectURL(videos[idx].src);
  videos.splice(idx, 1);
  await IDB.delete(id);
  if (cur >= videos.length) cur = Math.max(0, videos.length - 1);
  SLOTS.forEach(s => { S[s].vid.dataset.id = ''; });
  refreshSlides(); renderVList(); updateStorage();
}

// ══════════════════════════════════════════════════════
// ストレージ表示
// ══════════════════════════════════════════════════════
async function updateStorage() {
  try {
    if (navigator.storage?.estimate) {
      const { usage, quota } = await navigator.storage.estimate();
      const pct = Math.min(100, (usage / quota) * 100);
      stBar.style.width = pct + '%';
      stBar.style.background = pct > 80 ? '#f87171' : pct > 60 ? '#fbbf24' : '#4ade80';
      stText.textContent = `ストレージ: ${fmtB(usage)} / ${fmtB(quota)}`;
    } else {
      const total = videos.reduce((a, v) => a + (v.size||0), 0);
      stText.textContent = `動画合計: ${fmtB(total)}`;
    }
  } catch { stText.textContent = ''; }
}

// ══════════════════════════════════════════════════════
// 視聴ログ
// ══════════════════════════════════════════════════════
function renderWatchLog() {
  if (!watchLog.length) { wlogEl.innerHTML = '<div class="dempty">まだデータがありません</div>'; return; }
  const totalMs  = watchLog.reduce((a, e) => a + e.ms, 0);
  const uniq     = new Set(watchLog.map(e => e.id)).size;
  let h = '<div class="log-tbl"><div class="log-row log-head"><span>動画名</span><span>視聴時間</span></div>';
  watchLog.forEach(e => {
    h += `<div class="log-row"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:165px">${e.title}</span><span style="flex-shrink:0">${fmtT(e.ms)}</span></div>`;
  });
  h += `</div><div class="log-sum"><div class="log-sum-row"><span>総視聴時間</span><span>${fmtT(totalMs)}</span></div><div class="log-sum-row"><span>視聴動画数</span><span>${uniq}</span></div></div>`;
  wlogEl.innerHTML = h;
}

// ══════════════════════════════════════════════════════
// 起動：IndexedDBから復元
// ══════════════════════════════════════════════════════
async function init() {
  await IDB.open();
  const records = (await IDB.getAll()).sort((a, b) => (a.order||0) - (b.order||0));
  const total = records.length;
  for (let i = 0; i < total; i++) {
    const r = records[i];
    videos.push({ id: r.id, title: r.title, src: URL.createObjectURL(r.blob), order: r.order||i, size: r.size||0 });
    lBar.style.width = Math.round(((i+1)/total)*100) + '%';
    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0)); // UIフリーズ防止
  }
  // ローディング非表示
  loadEl.style.transition = 'opacity .3s';
  loadEl.style.opacity = '0';
  setTimeout(() => { loadEl.style.display = 'none'; }, 320);
  refreshSlides();
  renderVList();
  updateStorage();
}

init().catch(() => {
  loadEl.style.display = 'none';
  refreshSlides();
});
</script>
